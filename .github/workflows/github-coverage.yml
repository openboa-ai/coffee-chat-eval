name: Eval code coverage

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions: {}

jobs:
  coverage:
    name: Collect JavaScript coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Verify trusted pull request author
        if: github.event_name == 'pull_request'
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER)
              printf '%s\n' 'author=trusted_member'
              ;;
            *)
              if [ "$PR_AUTHOR_LOGIN" = "openboa" ]; then
                printf '%s\n' 'author=trusted_official_login'
              else
                printf '%s\n' 'author=untrusted' >&2
                exit 1
              fi
              ;;
          esac
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.5.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
        shell: bash
      - name: Run complete fixture suite with coverage
        run: |
          mkdir -p coverage
          node --experimental-strip-types \
            --test \
            --experimental-test-coverage \
            --test-reporter=lcov \
            --test-reporter-destination=coverage/lcov.info \
            tests/*.test.ts
        shell: bash
      - name: Convert lcov to Cobertura XML
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            --no-deps \
            --require-hashes \
            --requirement .github/coverage-requirements.txt
          python3 -m lcov_cobertura coverage/lcov.info --output coverage/cobertura.xml
        shell: bash
      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-report-javascript
          path: coverage/cobertura.xml
          if-no-files-found: error
          retention-days: 1

  upload-coverage-javascript:
    name: Upload JavaScript coverage
    needs: coverage
    if: ${{ !cancelled() && needs.coverage.result == 'success' &&
      github.event_name != 'merge_group' && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: coverage-report-javascript
      - name: Upload coverage to GitHub
        uses: actions/upload-code-coverage@1c15be36fc3733ba839b1dd643bd9556e4426dc1
        with:
          file: cobertura.xml
          language: JavaScript
          label: eval-javascript
