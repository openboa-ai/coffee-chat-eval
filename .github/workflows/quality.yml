name: Eval

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: required
    runs-on: ubuntu-24.04
    steps:
      - name: Verify trusted pull request author
        if: github.event_name == 'pull_request'
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER)
              printf '%s\n' 'author=trusted_member'
              ;;
            *)
              printf '%s\n' 'author=untrusted' >&2
              exit 1
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.5.0
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run dry-run
      - run: npm run smoke
      - run: npm run ci:policy
  dependency-review:
    name: dependency review
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
      - if: github.event_name == 'merge_group'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          base-ref: ${{ github.event.merge_group.base_sha }}
          head-ref: ${{ github.sha }}
      - if: github.event_name == 'workflow_dispatch'
        run: npm audit --audit-level=high
  aggregate:
    name: aggregate
    if: always()
    needs: [quality, dependency-review]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          test "${{ needs.quality.result }}" = success
          test "${{ needs.dependency-review.result }}" = success
