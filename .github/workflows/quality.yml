name: Eval

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: required
    runs-on: ubuntu-24.04
    steps:
      - name: Verify trusted pull request author
        if: github.event_name == 'pull_request'
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER)
              printf '%s\n' 'author=trusted_member'
              ;;
            *)
              printf '%s\n' 'author=untrusted' >&2
              exit 1
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install immutable Gitleaks
        run: .github/scripts/install-gitleaks.sh
      - name: Scan complete Git history
        run: |
          test ! -e .gitleaks.toml
          printf '%s  %s\n' \
            '5b78ddc165d282a346988abf15a48875a24020aa340a0984dd3cee9d27da9a50' \
            '.gitleaksignore' | sha256sum --check
          gitleaks git --config "$GITLEAKS_TRUSTED_CONFIG" \
            --gitleaks-ignore-path .gitleaksignore --ignore-gitleaks-allow \
            --redact --no-banner .
          gitleaks dir --config "$GITLEAKS_TRUSTED_CONFIG" \
            --gitleaks-ignore-path .gitleaksignore --ignore-gitleaks-allow \
            --redact --no-banner .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.5.0
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run canary:check
      - run: npm run dry-run
      - run: npm run smoke
      - run: npm run ci:policy
  dependency-review:
    name: dependency review
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
      - if: github.event_name == 'merge_group'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          base-ref: ${{ github.event.merge_group.base_sha }}
          head-ref: ${{ github.sha }}
      - if: github.event_name == 'workflow_dispatch'
        run: npm audit --audit-level=high
  harbor-contract:
    name: harbor contract
    runs-on: ubuntu-24.04
    steps:
      - name: Verify trusted pull request author
        if: github.event_name == 'pull_request'
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER)
              printf '%s\n' 'author=trusted_member'
              ;;
            *)
              printf '%s\n' 'author=untrusted' >&2
              exit 1
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.5.0
      - run: python -m pip install --disable-pip-version-check uv==0.8.3
      - run: npm run canary:calibrate
      - run: npm run benchmark:calibrate
  aggregate:
    name: aggregate
    if: always()
    needs: [quality, dependency-review, harbor-contract]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          test "${{ needs.quality.result }}" = success
          test "${{ needs.dependency-review.result }}" = success
          test "${{ needs.harbor-contract.result }}" = success
