name: Eval

on:
  pull_request:

permissions: {}

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  eligibility:
    name: author eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Decide author eligibility
        env:
          ACTOR: ${{ github.actor }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          BASE_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              case "$AUTHOR_ASSOCIATION" in
                OWNER|MEMBER)
                  test "$ACTOR" = "$PR_AUTHOR"
                  test "$HEAD_REPOSITORY" = "$BASE_REPOSITORY"
                  ;;
                *)
                  test "$ACTOR" = "dependabot[bot]"
                  test "$PR_AUTHOR" = "dependabot[bot]"
                  test "$HEAD_REPOSITORY" = "$BASE_REPOSITORY"
                  ;;
              esac
              ;;
            *) exit 1 ;;
          esac

  quality:
    name: required
    needs: eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install immutable Gitleaks
        run: .github/scripts/install-gitleaks.sh
      - name: Scan complete Git history and worktree
        run: |
          test ! -e .gitleaks.toml
          printf '%s  %s\n' \
            '5b78ddc165d282a346988abf15a48875a24020aa340a0984dd3cee9d27da9a50' \
            '.gitleaksignore' | sha256sum --check
          gitleaks git --config "$GITLEAKS_TRUSTED_CONFIG" \
            --gitleaks-ignore-path .gitleaksignore --ignore-gitleaks-allow \
            --redact --no-banner .
          gitleaks dir --config "$GITLEAKS_TRUSTED_CONFIG" \
            --gitleaks-ignore-path .gitleaksignore --ignore-gitleaks-allow \
            --redact --no-banner .
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Authenticate the isolated policy parser lock
        run: node .github/policy-bootstrap.mjs
      - run: npm ci --ignore-scripts --prefix .github/policy-parser
      - run: npm audit --audit-level=moderate --prefix .github/policy-parser
      - name: Enforce repository policy before candidate dependencies
        run: node .github/ci-policy.mjs
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run canary:check
      - run: npm run dry-run
      - run: npm run smoke
      - run: npm run ci:policy

  dependency-review:
    name: dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review pull-request dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime,development,unknown
          show-patched-versions: true
          comment-summary-in-pr: never

  harbor-contract:
    name: harbor contract
    needs: eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Authenticate the isolated policy parser lock
        run: node .github/policy-bootstrap.mjs
      - run: npm ci --ignore-scripts --prefix .github/policy-parser
      - run: npm audit --audit-level=moderate --prefix .github/policy-parser
      - name: Enforce repository policy before candidate dependencies
        run: node .github/ci-policy.mjs
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - name: Install hash-verified uv
        run: >-
          python3 -m pip install --disable-pip-version-check --require-hashes
          -r .github/uv-requirements.txt
      - name: Install hash-locked Harbor environment
        run: |
          uv venv --python python3 --no-python-downloads "$RUNNER_TEMP/harbor-venv"
          uv pip install --require-hashes --no-deps --only-binary :all: \
            --python "$RUNNER_TEMP/harbor-venv/bin/python" \
            -r .github/harbor-requirements.txt
      - run: npm run canary:calibrate
        env:
          HARBOR_COMMAND: ${{ runner.temp }}/harbor-venv/bin/harbor
      - run: npm run benchmark:calibrate
        env:
          HARBOR_COMMAND: ${{ runner.temp }}/harbor-venv/bin/harbor
      - run: npm run pcda:calibrate

  aggregate:
    name: aggregate
    if: always()
    needs:
      - eligibility
      - quality
      - dependency-review
      - harbor-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every applicable lane
        env:
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          ELIGIBILITY_RESULT: ${{ needs.eligibility.result }}
          HARBOR_CONTRACT_RESULT: ${{ needs.harbor-contract.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          test "$ELIGIBILITY_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$DEPENDENCY_REVIEW_RESULT" = success
          test "$HARBOR_CONTRACT_RESULT" = success
