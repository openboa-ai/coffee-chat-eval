name: Eval CodeQL

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    name: JavaScript-TypeScript
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@f411752efdf656cb71aa17b755b22c890960da1d
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@f411752efdf656cb71aa17b755b22c890960da1d
