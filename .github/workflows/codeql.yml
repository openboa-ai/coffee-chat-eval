name: Eval CodeQL

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    name: JavaScript-TypeScript
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: github/codeql-action/init@f411752efdf656cb71aa17b755b22c890960da1d
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@f411752efdf656cb71aa17b755b22c890960da1d
