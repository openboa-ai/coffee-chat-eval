name: Eval CodeQL

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number ||
    github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: JavaScript-TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3
